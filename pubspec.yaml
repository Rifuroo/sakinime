
name: coba_anime
description: "Suki."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Network
  http: ^1.1.0
  dio: ^5.3.0
  html: ^0.15.4
  
  # State Management
  provider: ^6.0.0
  shared_preferences: ^2.2.2
  
  # UI
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^2.6.0
  cupertino_icons: ^1.0.6
  
  # Video Players - iOS Compatible
  video_player: ^2.10.0
  chewie: ^1.7.5
  wakelock_plus: ^1.2.0
  video_player_win: ^3.2.1
  
  # WebView untuk fallback
  webview_flutter: ^4.4.2
  flutter_inappwebview: ^6.1.5
  
  # Media Kit for cross-platform video playback
  media_kit: ^1.2.2
  media_kit_video: ^1.2.6
  
  # Windows specific
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_windows_audio: ^1.0.9
  
  # Android specific
  media_kit_libs_video: ^1.0.7
  
  # Translation - using compatible version
  translator: ^1.0.4+1
  window_manager: ^0.3.9
  
  # Modern Window Management for Desktop
  bitsdojo_window: ^0.1.6
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_database: ^12.1.0
  google_sign_in: ^5.4.4
  url_launcher: ^6.3.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  
  # UI Components
  font_awesome_flutter: ^10.6.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/splash.json
    - assets/animations/loading.json
    - assets/animations/logo/logo_apk.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/animations/logo/logo_apk.png"
  adaptive_icon_background: "#0a0e27"
  adaptive_icon_foreground: "assets/animations/logo/logo_apk.png"
  min_sdk_android: 21